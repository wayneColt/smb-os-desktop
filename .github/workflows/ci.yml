name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l cmd internal packs web/embed.go)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: go test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

  release-build:
    name: release build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint the install script
        run: sh -n scripts/install.sh
      - name: Build every platform
        run: bash scripts/build_release.sh 0.0.0-ci
      - name: Verify checksums and the linux/amd64 binary
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          unzip -q -o smb-os-desktop_0.0.0-ci_linux_amd64.zip -d smoke
          test "$(./smoke/aios --version)" = "aios 0.0.0-ci"
